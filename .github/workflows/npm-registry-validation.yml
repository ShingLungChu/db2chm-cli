name: Verify published npm beta
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful run holding accepted-npm-release
        required: true
permissions:
  contents: read
  actions: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: windows-2025, platform: win32-x64 }
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: macos-26, platform: darwin-arm64 }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - run: node scripts/select-node.cjs 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: accepted-npm-release
          path: accepted/
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Install real npm version, verify registry integrity and export CHM
        run: node scripts/check-bundle-install.cjs accepted target/registry-check --registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registry-check-${{ matrix.target.platform }}
          path: |
            target/registry-check/installed.json
            target/registry-check/document 中文/
          if-no-files-found: error
  windows-extraction:
    needs: install
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: registry-check-*
          path: registry-checks/
      - shell: pwsh
        run: ./scripts/verify-windows-chm.ps1 -ArtifactRoot ./registry-checks -ScenarioSet registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registry-windows-extraction
          path: registry-checks/windows-verification.json
          if-no-files-found: error
