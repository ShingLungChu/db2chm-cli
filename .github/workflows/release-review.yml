name: Collect private release review
on:
  workflow_run:
    workflows: [Build pinned CHM toolchain]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful pinned CHM toolchain run to review
        required: true
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Node 22
        run: node scripts/select-node.cjs 22
      - name: Download and verify immutable completed-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: node scripts/download-validation.cjs "$SOURCE_RUN" target/review-inputs
      - name: Collect exact private tarballs, Java payload and native evidence
        run: node scripts/collect-validation.cjs target/review-inputs target/release-review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-release-review
          path: target/release-review/
          if-no-files-found: error
          retention-days: 14
